<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Login - YouTube Manager</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --muted: #94a3b8; --primary: #3b82f6; --danger: #ef4444; --success: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { width: 100%; max-width: 900px; }
        
        /* Login Box */
        .login-box { background: var(--panel); padding: 40px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; display: block; }
        .login-box h2 { color: #38bdf8; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; margin-bottom: 20px; outline: none; text-align: center; letter-spacing: 1px; }
        .login-box button { width: 100%; padding: 15px; border-radius: 8px; background: var(--primary); color: white; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .login-box button:hover { background: #2563eb; }

        /* Dashboard */
        .dashboard { display: none; }
        
        /* Header */
        .header { background: var(--panel); padding: 20px; border-radius: 16px; border: 1px solid #334155; display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .header img { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--primary); }
        .header-info h2 { font-size: 24px; margin-bottom: 5px; }
        .header-info p { color: var(--muted); font-size: 14px; }
        .stats { display: flex; gap: 20px; margin-top: 10px; }
        .stat-item { font-size: 14px; color: #38bdf8; font-weight: bold; }
        .btn-logout { margin-left: auto; background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn { padding: 12px 20px; background: var(--panel); border: 1px solid #334155; color: var(--muted); border-radius: 8px; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Tab Content */
        .tab-content { display: none; background: var(--panel); padding: 20px; border-radius: 16px; border: 1px solid #334155; }
        .tab-content.active { display: block; }
        
        /* Forms & Lists */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        .form-group input[type="file"] { padding: 8px; }
        .btn-action { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; overflow: hidden; padding: 10px; }
        .card img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
        .card h4 { font-size: 14px; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-actions { display: flex; gap: 8px; }
        .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 5px; cursor: pointer; border: none; color: white; }
        .btn-edit { background: #f59e0b; }
        .btn-delete { background: var(--danger); }
        .btn-sub { background: var(--danger); }
        
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .alert.success { background: rgba(16,185,129,0.2); border: 1px solid var(--success); color: var(--success); display: block; }
        .alert.error { background: rgba(239,68,68,0.2); border: 1px solid var(--danger); color: var(--danger); display: block; }
    </style>
</head>
<body>

<div class="container">
    <!-- LOGIN BOX -->
    <div class="login-box" id="loginBox">
        <h2>Login with Token</h2>
        <p style="color:var(--muted); margin-bottom: 20px;">Enter your API Token to access your YouTube Dashboard.</p>
        <div id="loginAlert" class="alert"></div>
        <input type="text" id="tokenInput" placeholder="Enter your token...">
        <button onclick="login()">Login to Dashboard</button>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard">
        
        <!-- Header -->
        <div class="header">
            <img id="channelImg" src="" alt="Channel">
            <div class="header-info">
                <h2 id="channelName">Loading...</h2>
                <div class="stats">
                    <div class="stat-item">👥 Subs: <span id="subCount">0</span></div>
                    <div class="stat-item">🎬 Videos: <span id="vidCount">0</span></div>
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('myVideos')">My Videos</button>
            <button class="tab-btn" onclick="switchTab('upload')">Upload Video</button>
            <button class="tab-btn" onclick="switchTab('subscriptions')">Subscriptions</button>
        </div>

        <!-- Tab: My Videos -->
        <div id="myVideos" class="tab-content active">
            <h3>Your Uploaded Videos</h3>
            <div id="videoGrid" class="grid"></div>
        </div>

        <!-- Tab: Upload -->
        <div id="upload" class="tab-content">
            <h3>Upload New Video</h3>
            <div id="uploadAlert" class="alert"></div>
            <div class="form-group">
                <label>Video File (MP4, MKV):</label>
                <input type="file" id="videoFile" accept="video/*">
            </div>
            <div class="form-group">
                <label>Title:</label>
                <input type="text" id="videoTitle" placeholder="Enter video title">
            </div>
            <div class="form-group">
                <label>Description:</label>
                <textarea id="videoDesc" rows="4" placeholder="Enter video description"></textarea>
            </div>
            <button class="btn-action" onclick="uploadVideo()">🚀 Upload to YouTube</button>
        </div>

        <!-- Tab: Subscriptions -->
        <div id="subscriptions" class="tab-content">
            <h3>Your Subscriptions</h3>
            <div id="subGrid" class="grid"></div>
        </div>

    </div>
</div>

<script>
    const API_BASE = "https://no-fun-only-money.onrender.com/api";
    let CURRENT_TOKEN = "";

    // --- HELPER FUNCTIONS ---
    function showAlert(containerId, msg, type) {
        const el = document.getElementById(containerId);
        el.className = `alert ${type}`;
        el.innerText = msg;
        setTimeout(() => { el.className = "alert"; }, 5000);
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');

        if(tabId === 'myVideos') loadVideos();
        if(tabId === 'subscriptions') loadSubscriptions();
    }

    // --- LOGIN & LOGOUT ---
    async function login() {
        const token = document.getElementById('tokenInput').value.trim();
        if (!token) return showAlert('loginAlert', 'Please enter a token', 'error');

        try {
            const res = await fetch(`${API_BASE}?token=${token}&action=check_token`);
            const data = await res.json();

            if (data.status === 'success') {
                CURRENT_TOKEN = token;
                localStorage.setItem('yt_token', token);
                
                // Set Header Info
                document.getElementById('channelImg').src = data.channel.picture;
                document.getElementById('channelName').innerText = data.channel.title;
                document.getElementById('subCount').innerText = data.channel.subscribers;
                document.getElementById('vidCount').innerText = data.channel.videos;

                // Show Dashboard
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

                loadVideos();
            } else {
                showAlert('loginAlert', data.message || 'Invalid Token', 'error');
            }
        } catch (err) {
            showAlert('loginAlert', 'Network Error. Please try again.', 'error');
        }
    }

    function logout() {
        localStorage.removeItem('yt_token');
        location.reload();
    }

    // --- LOAD VIDEOS ---
    async function loadVideos() {
        const grid = document.getElementById('videoGrid');
        grid.innerHTML = '<p>Loading videos...</p>';
        try {
            const res = await fetch(`${API_BASE}?token=${CURRENT_TOKEN}&action=get_videos`);
            const data = await res.json();
            
            if (data.status === 'success' && data.results.length > 0) {
                grid.innerHTML = '';
                data.results.forEach(v => {
                    grid.innerHTML += `
                        <div class="card">
                            <img src="${v.thumbnail}" alt="thumb">
                            <h4>${v.title}</h4>
                            <div class="card-actions">
                                <button class="btn-sm btn-edit" onclick="editVideo('${v.videoId}', '${v.title.replace(/'/g, "\\'")}', '${v.description.replace(/'/g, "\\'")}')">Edit</button>
                                <button class="btn-sm btn-delete" onclick="deleteVideo('${v.videoId}')">Delete</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                grid.innerHTML = '<p>No videos uploaded yet.</p>';
            }
        } catch (err) {
            grid.innerHTML = '<p style="color:red">Error loading videos.</p>';
        }
    }

    // --- DELETE VIDEO ---
    async function deleteVideo(videoId) {
        if (!confirm("Are you sure you want to delete this video from YouTube?")) return;
        try {
            const res = await fetch(`${API_BASE}?token=${CURRENT_TOKEN}&action=delete_video&video_id=${videoId}`);
            const data = await res.json();
            alert(data.message || data.error);
            loadVideos();
        } catch (err) { alert("Error deleting video."); }
    }

    // --- EDIT VIDEO ---
    async function editVideo(videoId, currentTitle, currentDesc) {
        const newTitle = prompt("Enter new title:", currentTitle);
        if (newTitle === null) return;
        const newDesc = prompt("Enter new description:", currentDesc);
        if (newDesc === null) return;

        try {
            const res = await fetch(`${API_BASE}?token=${CURRENT_TOKEN}&action=edit_video`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ video_id: videoId, title: newTitle, description: newDesc })
            });
            const data = await res.json();
            alert(data.message || data.error);
            loadVideos();
        } catch (err) { alert("Error editing video."); }
    }

    // --- UPLOAD VIDEO ---
    async function uploadVideo() {
        const fileInput = document.getElementById('videoFile');
        const title = document.getElementById('videoTitle').value;
        const desc = document.getElementById('videoDesc').value;

        if (fileInput.files.length === 0) return showAlert('uploadAlert', 'Please select a video file', 'error');
        if (!title) return showAlert('uploadAlert', 'Please enter a title', 'error');

        const formData = new FormData();
        formData.append('video', fileInput.files[0]);
        formData.append('title', title);
        formData.append('description', desc);

        showAlert('uploadAlert', 'Uploading video... Please wait (This may take a few minutes).', 'success');
        
        try {
            const res = await fetch(`${API_BASE}?token=${CURRENT_TOKEN}&action=upload_video`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            
            if (data.status === 'success') {
                showAlert('uploadAlert', '✅ Video uploaded successfully!', 'success');
                document.getElementById('videoTitle').value = '';
                document.getElementById('videoDesc').value = '';
                document.getElementById('videoFile').value = '';
                loadVideos();
            } else {
                showAlert('uploadAlert', data.error || 'Upload failed', 'error');
            }
        } catch (err) {
            showAlert('uploadAlert', 'Server error during upload.', 'error');
        }
    }

    // --- LOAD SUBSCRIPTIONS ---
    async function loadSubscriptions() {
        const grid = document.getElementById('subGrid');
        grid.innerHTML = '<p>Loading subscriptions...</p>';
        try {
            const res = await fetch(`${API_BASE}?token=${CURRENT_TOKEN}&action=subscriptions`);
            const data = await res.json();
            
            if (data.status === 'success' && data.results.length > 0) {
                grid.innerHTML = '';
                data.results.forEach(sub => {
                    grid.innerHTML += `
                        <div class="card">
                            <img src="${sub.thumbnail}" alt="thumb">
                            <h4>${sub.title}</h4>
                            <div class="card-actions">
                                <button class="btn-sm btn-sub" onclick="unsubscribe('${sub.channelId}')">Unsubscribe</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                grid.innerHTML = '<p>No subscriptions found.</p>';
            }
        } catch (err) {
            grid.innerHTML = '<p style="color:red">Error loading subscriptions.</p>';
        }
    }

    // --- UNSUBSCRIBE ---
    async function unsubscribe(channelId) {
        if (!confirm("Are you sure you want to unsubscribe?")) return;
        try {
            const res = await fetch(`${API_BASE}?token=${CURRENT_TOKEN}&action=unsubscribe&channel_id=${channelId}`);
            const data = await res.json();
            alert(data.message || data.error);
            loadSubscriptions();
        } catch (err) { alert("Error unsubscribing."); }
    }

    // --- AUTO LOGIN ON PAGE LOAD ---
    window.onload = () => {
        const savedToken = localStorage.getItem('yt_token');
        if (savedToken) {
            document.getElementById('tokenInput').value = savedToken;
            login();
        }
    };
</script>
</body>
</html>
